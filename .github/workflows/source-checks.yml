name: Source checks (no game input)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/test_release_source.py
      - run: python tools/test_prx_image.py
      - run: python tools/test_windows_build.py
      - run: python tools/check_public_source.py
      - run: python tools/export_source.py
